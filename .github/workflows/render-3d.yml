# Renderiza vídeos 3D con Blender en los servidores de GitHub.
#
# GRATIS solo en repositorios PÚBLICOS (los runners estándar de GitHub no tienen coste en
# repositorios públicos). Por seguridad, si el repositorio es privado NO se arranca ninguna
# máquina (los trabajos se omiten y no consumen minutos).
#
# Se activa al subir/modificar un archivo en render3d/jobs/*.json (también desde el panel
# Content-OS en el iPhone) o a mano desde la pestaña Actions.
#
# Reanudación: si el encargo incluye "reuse_runs": [ID, ...] (ejecuciones anteriores) o
# "reuse_branch": "rama" (fotogramas guardados en una rama del repositorio), se reutilizan los
# fotogramas ya renderizados y solo se renderizan los que falten.
name: Render 3D (Blender)

on:
  push:
    paths: ['render3d/jobs/**.json']
  workflow_dispatch:
    inputs:
      job:
        description: 'Archivo del encargo (p. ej. render3d/jobs/carrera-rojo-vs-amarillo.json)'
        required: true

permissions:
  contents: write
  actions: write   # para borrar los fotogramas intermedios al terminar (ahorra almacenamiento)

concurrency:
  group: render3d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    outputs:
      job: ${{ steps.pick.outputs.job }}
      name: ${{ steps.pick.outputs.name }}
      chunks: ${{ steps.plan.outputs.chunks }}
      samples: ${{ steps.plan.outputs.samples }}
      reuse: ${{ steps.plan.outputs.reuse }}
      reuse_branch: ${{ steps.plan.outputs.reuse_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: pick
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then JOB="${{ github.event.inputs.job }}";
          else JOB=$(git diff-tree --no-commit-id --name-only -r --root HEAD -- 'render3d/jobs/*.json' | tail -1); fi
          if [ -z "$JOB" ] || [ ! -f "$JOB" ]; then echo "No hay encargo"; exit 1; fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JOB" .json)" >> "$GITHUB_OUTPUT"
      - name: Recuperar fotogramas ya renderizados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          RB=$(python3 -c "import json;print(json.load(open('${{ steps.pick.outputs.job }}')).get('reuse_branch', ''))")
          if [ -n "$RB" ]; then
            mkdir -p prev/branch
            if git fetch --depth 1 origin "$RB"; then git archive FETCH_HEAD | tar -x -C prev/branch; else echo "No se pudo leer la rama $RB"; fi
          fi
          for RID in $(python3 -c "import json;print(' '.join(str(x) for x in json.load(open('${{ steps.pick.outputs.job }}')).get('reuse_runs', [])))"); do
            echo "Descargando fotogramas de la ejecución $RID"
            gh run download "$RID" -R "${{ github.repository }}" -p 'frames-*' -D "prev/$RID" || echo "No se pudieron recuperar (¿caducados?)"
          done
          find prev -name 'f*.jpg' | wc -l
      - id: plan
        run: |
          JOB="${{ steps.pick.outputs.job }}"
          CF=$(python3 -c "import json;print(json.load(open('$JOB')).get('render',{}).get('chunk_frames',35))")
          S=$(python3 -c "import json;print(json.load(open('$JOB')).get('render',{}).get('samples',14))")
          R=$(python3 -c "import json;print(' '.join(str(x) for x in json.load(open('$JOB')).get('reuse_runs', [])))")
          python3 render3d/pipeline.py plan --chunk-frames "$CF" --have-dir prev --spec "$JOB" > plan.json
          cat plan.json
          echo "chunks=$(python3 -c "import json;print(json.dumps(json.load(open('plan.json'))['chunks']))")" >> "$GITHUB_OUTPUT"
          echo "samples=$S" >> "$GITHUB_OUTPUT"
          echo "reuse=$R" >> "$GITHUB_OUTPUT"
          echo "reuse_branch=$(python3 -c "import json;print(json.load(open('$JOB')).get('reuse_branch', ''))")" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    if: needs.plan.outputs.chunks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        range: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: render3d/requirements-render.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon0 libsm6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libegl1 libgl1 > /dev/null
      - run: pip install -r render3d/requirements-render.txt
      - name: Renderizar fotogramas ${{ matrix.range[0] }}-${{ matrix.range[1] }}
        run: python render3d/pipeline.py render --out frames --frames ${{ matrix.range[0] }} ${{ matrix.range[1] }} --samples ${{ needs.plan.outputs.samples }} --spec "${{ needs.plan.outputs.job }}"
      # Se guarda SIEMPRE (también si se cancela o se corta): así no se pierde trabajo.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.range[0] }}
          path: frames/*.jpg
          retention-days: 4
          if-no-files-found: ignore

  finish:
    needs: [plan, render]
    if: always() && needs.plan.result == 'success' && (needs.render.result == 'success' || needs.render.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
      - run: pip install -r render3d/requirements-finish.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: frames
          merge-multiple: true
      - name: Añadir fotogramas de ejecuciones anteriores
        if: needs.plan.outputs.reuse != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for RID in ${{ needs.plan.outputs.reuse }}; do
            gh run download "$RID" -R "${{ github.repository }}" -p 'frames-*' -D "prev/$RID" || true
          done
          find prev -name 'f*.jpg' -exec cp -n {} frames/ \;
          ls frames | wc -l
      - name: Añadir fotogramas guardados en la rama de caché
        if: needs.plan.outputs.reuse_branch != ''
        run: |
          mkdir -p cache frames
          git fetch --depth 1 origin "${{ needs.plan.outputs.reuse_branch }}"
          git archive FETCH_HEAD | tar -x -C cache
          find cache -name 'f*.jpg' -exec cp -n {} frames/ \;
          ls frames | wc -l
      - name: Audio, HUD, subtítulos y montaje MP4
        run: python render3d/pipeline.py finish --frames frames --out out/${{ needs.plan.outputs.name }}.mp4 --spec "${{ needs.plan.outputs.job }}"
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ needs.plan.outputs.name }}
          path: out/${{ needs.plan.outputs.name }}*
          retention-days: 3
      - name: Publicar como Release (descarga directa desde el iPhone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="video-${{ needs.plan.outputs.name }}-${{ github.run_number }}"
          gh release create "$TAG" out/${{ needs.plan.outputs.name }}* \
            --target "${{ github.sha }}" --prerelease \
            --title "🎬 ${{ needs.plan.outputs.name }} (render #${{ github.run_number }})" \
            --notes "Vídeo 3D generado con Blender (Cycles) en GitHub Actions. Revisa los créditos en el archivo -creditos.txt."
      # El vídeo ya está en Releases: borramos los fotogramas intermedios (de esta ejecución y de las
      # reutilizadas) para no ocupar el cupo de almacenamiento de Actions (500 MB en el plan gratuito).
      - name: Borrar fotogramas intermedios
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for RID in ${{ github.run_id }} ${{ needs.plan.outputs.reuse }}; do
            for ID in $(gh api "repos/${{ github.repository }}/actions/runs/$RID/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("frames-")) | .id'); do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$ID" && echo "borrado $ID"
            done
          done
