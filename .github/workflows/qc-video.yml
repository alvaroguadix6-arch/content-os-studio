# Control de calidad de un vídeo ya renderizado (manual, solo lectura, gratis).
# Descarga el artefacto de una ejecución de «Render paquete» y mide formato, sonoridad, silencios,
# planos congelados y negros. Deja el informe en el resumen y una hoja de contactos como artefacto.
name: QC vídeo

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID de la ejecución de «Render paquete» (número de la URL de Actions)"
        required: true

permissions:
  contents: read
  actions: read   # solo para descargar el artefacto de esa ejecución

jobs:
  qc:
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validar entrada
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: '[[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "run_id inválido"; exit 1; }'
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: video
      - name: Medir
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          F=$(find video -name '*.mp4' | head -1)
          [ -n "$F" ] || { echo "no hay MP4 en el artefacto"; exit 1; }
          python3 tools/qc_video.py "$F" --hoja qc-hoja.jpg --resumen "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qc-hoja
          path: qc-hoja.jpg
          retention-days: 7
