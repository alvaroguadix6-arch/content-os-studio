# NIVEL OCULTO · Renderiza un paquete exportado desde instagram-agent con la plantilla de simulaciones.
#
# - SOLO manual (pestaña Actions → «Render paquete» → Run workflow) y solo desde main. Sin activadores
#   automáticos: subir un paquete NO lanza ningún render.
# - Gratis: los runners estándar no tienen coste en repositorios públicos. Si el repositorio fuera privado,
#   el trabajo se omite y no consume minutos.
# - Sin secretos. Permiso de solo lectura. Antes de renderizar se valida el paquete (tools/check_paquetes.py).
# - El MP4 queda como artefacto descargable 7 días. No se publica en ninguna red ni se crea ninguna Release.
name: Render paquete

on:
  workflow_dispatch:
    inputs:
      paquete:
        description: 'Ruta del paquete, p. ej. paquetes/2026-W49/2026-12-03-isla-de-los-faisanes.json'
        required: true
      confirmar:
        description: 'Escribe RENDER para confirmar'
        required: true

permissions:
  contents: read

concurrency:
  group: render-paquete-${{ inputs.paquete }}
  cancel-in-progress: false

jobs:
  render:
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/main' && inputs.confirmar == 'RENDER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validar ruta y paquete
        env:
          PKG: ${{ inputs.paquete }}
        run: |
          [[ "$PKG" =~ ^paquetes/[0-9]{4}-W[0-9]{2}/[a-z0-9-]+\.json$ ]] && [ -f "$PKG" ] || { echo "ruta inválida"; exit 1; }
          python3 tools/check_paquetes.py "$PKG"
          echo "NAME=$(basename "$PKG" .json)" >> "$GITHUB_ENV"

      - name: Herramientas gratuitas (ffmpeg, Inter, NumPy, SciPy, Pillow, Kokoro en CPU)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter espeak-ng > /dev/null
          pip install -q numpy scipy pillow soundfile
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q kokoro

      - name: Voz (Kokoro em_alex, como el resto de vídeos)
        env:
          PKG: ${{ inputs.paquete }}
        working-directory: render3d/simula
        run: |
          python nivel_oculto.py guion "../../$PKG" "$RUNNER_TEMP/voz/guion.json"
          python ../gravedad/voz.py "$RUNNER_TEMP/voz" --guion "$RUNNER_TEMP/voz/guion.json" --motor kokoro --voz em_alex

      - name: Plan, fotogramas y montaje
        env:
          PAQUETE: ${{ github.workspace }}/${{ inputs.paquete }}
        working-directory: render3d/simula
        run: |
          python nivel_oculto.py plan "$RUNNER_TEMP/voz"
          python nivel_oculto.py render "$RUNNER_TEMP/voz" "$RUNNER_TEMP/frames"
          mkdir -p "$RUNNER_TEMP/out"
          python montaje.py nivel_oculto --narracion "$RUNNER_TEMP/voz" --frames "$RUNNER_TEMP/frames" --out "$RUNNER_TEMP/out/$NAME.mp4"
          python zona_segura.py "$RUNNER_TEMP/out/$NAME.mp4" "$RUNNER_TEMP/out/$NAME-zona-segura.jpg" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.NAME }}
          path: ${{ runner.temp }}/out/
          retention-days: 7
